name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: The checked-in example documents are current
        run: go run ./cmd/docgen -C examples/petstore -check
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.10

  # A clean build, the way a user's go install does it.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go install works from a clean checkout
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install ./cmd/docgen
          "$RUNNER_TEMP/bin/docgen" -version
