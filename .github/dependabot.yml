version: 2
updates:
  # Security and maintenance updates of the modules docgen builds on. Four of
  # them decide what the generated documents look like: kin-openapi and yaml.v3
  # write the YAML, x/tools loads the packages, x/text cases the tags. A new
  # version of any of them is a change of the output, so it is made by hand, with
  # the example documents regenerated and the CHANGELOG written.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      go-dependencies:
        patterns: ["*"]
    ignore:
      - dependency-name: github.com/getkin/kin-openapi
      - dependency-name: golang.org/x/tools
      - dependency-name: golang.org/x/text
      - dependency-name: gopkg.in/yaml.v3
      # The requirements of this module are requirements of everybody who runs docgen
      # with `go tool`: the newest version in any go.mod of the graph is the one they
      # build with. testify is only used by the tests, so it stays at the oldest
      # version they work with (1.12 also added a dependency on another yaml module).
      - dependency-name: github.com/stretchr/testify
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
